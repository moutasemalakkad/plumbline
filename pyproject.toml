[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plumbline"
version = "0.1.0"
description = "Executor-agnostic text-to-SQL evaluation: execution accuracy, routing accuracy, a FLEX-style LLM judge, and a gold-set gate, every rate with a confidence interval."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Moutasem Akkad", email = "moutasemalakkad@gmail.com" }]
maintainers = [{ name = "Moutasem Akkad", email = "moutasemalakkad@gmail.com" }]
keywords = ["text-to-sql", "evaluation", "execution-accuracy", "spider", "bird"]
# Core is pure stdlib on purpose: the SQLite backend, the comparator, the
# metrics, and the gate run from a fresh clone with no third-party deps.
dependencies = []

[project.scripts]
plumbline = "plumbline.cli:main"

[project.optional-dependencies]
# Cloud / LLM backends live behind extras so the fast path stays stdlib-only.
bigquery = ["google-cloud-bigquery>=3.0"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/plumbline"]

[tool.pytest.ini_options]
# src-layout: let pytest import the package without an editable install,
# so `pytest` works the same in CI and from a bare checkout.
pythonpath = ["src"]
testpaths = ["tests"]
